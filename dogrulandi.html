<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>E-postan doğrulandı | Kızak</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #e8eaf0; font: 16px/1.6 "Segoe UI", system-ui, sans-serif; padding: 24px; }
  main { max-width: 440px; width: 100%; background: #141821; border: 1px solid #232a38; border-radius: 14px; padding: 36px 32px; text-align: center; }
  .tick { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%; background: #1d3a2b; display: grid; place-items: center; }
  .tick svg { width: 28px; height: 28px; stroke: #5fd48f; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { margin: 0; color: #aab1c2; }
  p + p { margin-top: 10px; }
</style>
</head>
<body>
<main>
  <div class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1>E-postan doğrulandı</h1>
  <p>Hesabın hazır. Bu sekmeyi kapatıp Kızak Launcher'a dönebilirsin.</p>
  <p>Launcher açıksa seni birkaç saniye içinde kendisi içeri alır.</p>
</main>
</body>
</html>
